[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmesh"
version = "0.1.0"
description = "Multi-tenant platform for deploying AI agents: MCP gateway, per-tenant RAG and LoRA, caches, usage billing and unit economics."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "mohi2006august", email = "nizamuddinnumaan822@gmail.com" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx2>=2.13",
  "jsonschema>=4.20",
  "click>=8.1",
  "cryptography>=42",
  "numpy>=2.0",
  "mcp>=2.2",
  "anthropic>=1.9",
]

[project.optional-dependencies]
# Production adapters. The local profile (SQLite, in-process stores) needs none of these.
postgres = ["psycopg[binary,pool]>=3.2"]
redis = ["redis>=5.0"]
kafka = ["aiokafka>=0.11"]
temporal = ["temporalio>=1.7"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "fakeredis>=2.23",
]

[project.scripts]
mesh = "mesh_sdk.cli:main"

# Each top-level component directory holds one importable `mesh_*` package,
# mirroring the repository layout in TECHNICAL.md.
[tool.setuptools.packages.find]
where = [
  "core",
  "sdk",
  "metering",
  "inference-router",
  "mcp-gateway",
  "runtime",
  "control-plane",
  "retrieval",
  "cache",
  "economics",
]
include = ["mesh_*"]

[tool.setuptools.package-data]
"*" = ["*.sql", "*.yaml", "*.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [
  "core",
  "sdk",
  "metering",
  "inference-router",
  "mcp-gateway",
  "runtime",
  "control-plane",
  "retrieval",
  "cache",
  "economics",
  ".",
]
markers = [
  "isolation: cross-tenant probes (run with `make test-isolation`)",
  "integration: needs external services (Postgres, Redis, Temporal); skipped when unavailable",
]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["console", "node_modules", ".venv", ".mesh"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B",
  "BLE",   # no blind `except Exception`
  "S110",  # no try/except/pass
  "S112",  # no try/except/continue
  "S105", "S106", "S107",  # no hard-coded secrets
  "ASYNC",
  "SIM",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]
"examples/**" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = [
  "mesh_core", "mesh_sdk", "mesh_metering", "mesh_inference", "mesh_gateway",
  "mesh_runtime", "mesh_control", "mesh_retrieval", "mesh_cache", "mesh_economics",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "core:sdk:metering:inference-router:mcp-gateway:runtime:control-plane:retrieval:cache:economics"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["console/", "node_modules/", "\\.venv/", "tests/"]
